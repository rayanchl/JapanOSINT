# The first CI this repository has ever had.
#
# Until now the entire safety net for 438k lines of C was a --selftest flag and
# a couple of scripts nobody could run, on a repo with a live GitHub remote.
# This is deliberately small and deliberately honest: every step here is one
# that passes today on a clean Ubuntu box. Nothing aspirational is wired in —
# a red build that is red for an unrelated reason gets ignored, and an ignored
# CI is the same as no CI.
#
# What it does NOT do, on purpose:
#   * no network-touching collector runs (they hit real third-party APIs)
#   * no llama-server (11 GB model); --selftest reports it "down" and passes
#   * no contract-parity suite (its fixtures need a DB with real intel rows)
#
# The client gap is now closed. `web-client` runs the vitest suite and the
# production build — both verified green offline before being wired in (3 files,
# 12 tests, ~23s; `vite build` transforms 2,010 modules in ~17s). `ios-build`
# compiles all targets on macOS with signing off; it is the one step here that
# could not be proven on the authoring machine (no macOS), so its first run is
# the proof. If it is red for an environment reason rather than a code reason,
# fix it or drop it — do not leave it red.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One run per branch at a time, and the newest push wins. Without this every
# push to a PR branch ran the workflow TWICE (the push event and the
# pull_request event, two macOS jobs each) and nothing cancelled a run whose
# commit had already been superseded — measured 2026-10-20: 68 queued runs,
# 136 macOS jobs ahead of a PR whose head was mergeable, hours behind five
# free-plan macOS runners. The group is the branch name under both events
# (head_ref on pull_request, ref_name on push), so the pull_request run that
# follows a push by a few seconds supersedes the push run of the same commit.
# main is never cancelled: a run there is the record of what merged.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      JO_SCHEMA: ${{ github.workspace }}/native/core/schema.sql

    steps:
      - uses: actions/checkout@v4

      # Keep the selftest's SQLite work in the runner's temp dir instead of the
      # checkout, so the schema-applied DB is never mistaken for tracked data.
      #
      # THIS CANNOT BE A JOB-LEVEL `env:` ENTRY, and that is why this workflow
      # had never run. Job-level env is evaluated before a runner exists, so the
      # only contexts in scope are github, needs, strategy, matrix, vars,
      # secrets and inputs — `runner` is not one of them. `${{ runner.temp }}`
      # there is an unrecognised named-value, which invalidates the whole FILE
      # rather than the one job: GitHub creates the run, fails it immediately
      # and schedules ZERO jobs. Every one of the first 74 runs failed that way,
      # from the very first commit of this file, so "ci is red" was never a test
      # result — nothing had ever been compiled or executed.
      #
      # $RUNNER_TEMP is the same path as an ordinary environment variable, and
      # $GITHUB_ENV publishes it to every later step in the job. `env:` values
      # are NOT shell-expanded, so writing `$RUNNER_TEMP/ci.db` up there would
      # hand the C a literal dollar sign instead.
      - name: Resolve the scratch DB path
        run: echo "JO_DB=$RUNNER_TEMP/ci.db" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libmecab-dev mecab zlib1g-dev \
            mecab-ipadic-utf8 ffmpeg
        # ffmpeg: tests/unit/test_netjail.c decodes a real HLS frame through
        # core/netjail.c's sandbox, and skips that step without it.
        # mecab-ipadic-utf8 is the dictionary MeCab needs at runtime. core/fts.c
        # degrades gracefully without it (g_init_failed, Latin passthrough), but
        # then the Japanese FTS path is never exercised at all, which is the
        # half most likely to break.

      - name: Build
        working-directory: native
        run: make -j"$(nproc)"

      - name: Selftest
        working-directory: native
        run: make selftest

      - name: Unit tests (dispatcher fan-out)
        working-directory: native
        run: make unit

      # The offline engine tests. hpengine.c is the only code path with
      # pagination, detail hops and in-band truncation notices, and
      # tests/hpengine_test.c asserts the house rules directly against it
      # (truncation notices, pagination, detail hops, missing-credential-is-
      # an-honest-empty) with a stubbed http_request. authtest generates real
      # RSA/EC keys and proves a JWT still verifies after the OpenSSL 3
      # migration. Neither needs network, a key, or a model. (hptest used to
      # run twice in this job, under two names; once is enough.)
      - name: Record-engine tests (house rules 1 and 2)
        working-directory: native
        run: make hptest

      - name: JWT public-key round-trip
        working-directory: native
        run: make authtest

      - name: Paging and truncation disclosure
        working-directory: native
        run: make pagewalktest

      - name: HTML attribute scanner
        working-directory: native
        run: make htmlparsetest

      # A feed URL that has stopped being a feed used to report rc=0 records=0 —
      # indistinguishable from a newspaper that published nothing. Four national
      # press feeds were serving their HTML homepage. rsstest pins that a 2xx
      # body which is not a feed is a FAILED fetch, and — the half that keeps it
      # safe — that a valid feed with no items is still an honest empty.
      - name: RSS/Atom toolkit (a dead feed is not an empty feed)
        working-directory: native
        run: make rsstest

      - name: Lint collector sources
        working-directory: native
        run: make lint-sources

      # A collector that moves out of the build glob stops registering with no
      # error: the build succeeds, the binary links, and only the source count
      # drops. That happened during the collectors/ reorganisation — four
      # separate tools under-reported while the binary was correct — so the
      # count is asserted rather than printed. Floor lives in
      # native/tools/source-floor.txt and only ever ratchets up.
      - name: Source count floor
        working-directory: native
        run: make source-floor

      # source-floor is a regex count over the source text. It counts
      # HP_REGISTER_TABLE rows now, but it was blind to them once and passed
      # for months while the hp spec table's fixed 1,024-entry array silently
      # dropped 1,481 rows at boot — and no text count can see a row dropped
      # AT REGISTRATION. This asks the binary instead (against a throwaway
      # JO_DB), and fails on any duplicate id or dropped row. Both floors are
      # committed and only ever ratchet up: record them when a batch lands.
      - name: Registry floor (asks the binary)
        working-directory: native
        run: make registry-floor

      # Gated on the strict set, reported everywhere else. audit-sources is a
      # heuristic scan for discarded data (docs/SOURCE_EXHAUSTIVENESS.md). Any
      # finding in the strict set — the hp tables (collectors/pivot/table/
      # hp*_*.c) and the generated deep-record tables (collectors/feed/
      # generated/hp1[0-9]_*.c) — exits 1 and fails this job. Findings in the
      # rest of the tree are printed (they were once 146 that no CI run ever
      # showed) but do not change the exit status; the tree is held at zero by
      # review, and a deliberate exception carries an `exhaustive-ok:` marker
      # on the flagged line.
      - name: Exhaustive-use audit (strict set gated)
        working-directory: native
        run: make audit-sources

      # THE MANIFEST GATES, offline. Each reads docs/candidate-sources-batch*
      # through tools/manifest.py and needs no network; they were run by hand
      # and by nothing else. Wired in only as far as they pass on the commit
      # that added them (2026-10-06) — a gate red on day one is a gate nobody
      # reads.
      #
      # House rule 3: a row with no entity token and no interval never runs.
      # 0 of 7,685 rows across 147 manifests; exit 1 on any such row, an
      # ambiguous opt, or a malformed line.
      - name: Manifest reachability (house rule 3)
        working-directory: native
        run: python3 tools/audit_batch_reachable.py --quiet ../docs/candidate-sources-batch*.txt

      # Duplicate ids/endpoints against the binary's registry is only meaningful
      # for a set NOT YET GENERATED into C — on a shipped manifest every row is
      # its own DUP-ID. The step checked batch 37's staging set until main
      # generated it (5d5e1f99, hp3b37_*.c), after which it failed 28 rows on
      # their own C. No staging set is pending; run
      #   python3 tools/batch_exclusions.py --bin ./bin/japanosint --check <new manifest>
      # on the next one, and restore a step pointing at it while it stages.

      # NOT GATING, deliberately and visibly. On 2026-10-06 this reports 104 of
      # 7,685 rows "declare no pagination but look paged" — all of them in the
      # batch 18 (96) and batch 19 (8) manifests, 29 in 18.portals alone. Those beats shipped long ago and
      # CLAUDE.md is explicit that the C, not the manifest, is the maintained
      # copy, so a flag here may already be fixed in the table (make
      # audit-sources gates the C for `single-page`). Each needs a human read
      # against its .c before this can gate; until then it is printed on every
      # run instead of not at all.
      - name: Manifest pagination (report only — 104 rows untriaged)
        working-directory: native
        continue-on-error: true
        run: python3 tools/audit_batch_pagination.py ../docs/candidate-sources-batch*.txt

      # THE SERVER MUST STAY ANSWERABLE WHILE IT IS BUSY.
      #
      # Twice now a route has been found holding the single mongoose event
      # loop: a cold /api/data/castles froze /api/health for 20 s (2026-09-07),
      # and three concurrent /api/status did it for 24.8 s (2026-09-11). Both
      # were found by a human running a benchmark by hand, months apart, and
      # both had been true since the code was written. This checks the property
      # on every push: while three /api/status calls are in flight,
      # /api/health must still answer inside half a second. Post-fix it answers in
      # 0.014 s, so the limit is not tight — a failure means a route went back
      # on the loop, not that the runner was busy. No network: the scheduler is
      # staggered out and the DB is a fresh schema.
      - name: Event loop stays free under load
        working-directory: native
        # 0.5 s, not 1.0: a /api/status build now takes ~0.25 s, so a build back
        # on the event loop would hold a probe behind up to three of them
        # (~0.75 s) and slip under 1.0. Healthy probes measure ~0.01 s.
        run: tools/ci_concurrency_gate.sh ./bin/japanosint 0.5

  # The race class this repo has already been bitten by — a strtok() cursor
  # shared between 8 scheduler workers and the HTTP thread, and transactions
  # crossing a shared SQLite handle — has never had a CI gate; `make tsan-sched`
  # is what found those, run by hand. This runs the unit suite under
  # ThreadSanitizer, which is the offline half (tsan-sched drives real
  # collectors and would need network). Separate job because the TSan object
  # tree is a second full build.
  # 90, not 60: the suite is 74 tests (48 on 2026-10-19 main, whose job took
  # 37 min). Measured from the run that hit 60: build 2.5 min, ~28 s a test,
  # test_alert_tenancy 17.5 min on its own (as on main: racer threads each
  # seed the 48k-row registry), and test_service_vec reached at minute 42 —
  # then cancelled inside it with 14 tests queued, a timeout and never a
  # result. vecindex_items_state() halved that test; this is the headroom.
  #
  # 150, not 90 (2026-10-22): the suite is 84 tests and the 90 is spent. A
  # TIMED-OUT JOB IS REPORTED `cancelled`, NOT `failure`, which is why this
  # needed measuring rather than reading — the run that hit it looks on the
  # PR exactly like a job somebody stopped. Four consecutive runs, oldest
  # first:
  #
  #     7d13e707  success    50.8 min
  #     d163738a  success    70.0 min
  #     4306358d  success    85.4 min   <- 4.6 min of headroom, green by luck
  #     8a91a064  cancelled  90.4 min   <- the wall, with the suite unfinished
  #
  # So this is not a flaky job and not the commit that hit it: the budget was
  # exhausted and the last green was already inside the noise. That is this
  # tree's own rule about a kill line — SLOW means unmeasured, not failed, and
  # the limit is a property of the tool rather than of what it measures.
  #
  # The number is the symptom. The cost driver is tests/unit/run.sh linking
  # EVERY object for each of the 84 tests, so the job grows with the product
  # and not with what a change touches — a per-test link under TSan, 84 times.
  # Fixing that is worth more than any ceiling, and this raise buys the room
  # to do it rather than standing in for it.
  #
  # BACK TO 90 (2026-10-23), because that fix is in: tests/unit/run.sh now
  # `ld -r`s the 1,807 objects no test excludes into one relocatable object
  # ONCE and links each test against that plus the 53 objects some test does
  # exclude. Measured on the plain build, same tree, same test: a full link is
  # **35.688 s** and a partial-link link is **2.674 s**, so the suite's link
  # budget goes from ~50 min to ~3.7 min, and the whole 84-test suite now runs
  # end to end in **494 s**. Subtracting that from the 90.4 min above predicts
  # a job around 45 min, which is where the 50.8-min run at the top of the
  # series sat with ten fewer tests. So this ceiling has roughly 2x headroom
  # again instead of 4.6 min, and it is a gate rather than a formality.
  #
  # If a run still comes in over ~70 min, the ceiling is the wrong lever a
  # second time and the next cost driver is already identified: a single test
  # can open the database dozens of times and every `db_open` seeds the whole
  # registry, which is now 58,054 rows. Measured while timing this change:
  # test_alert_tenancy alone does **39 full db_opens** (the 2026-10-19 note
  # above clocked it at 17.5 min on its own, with the registry at 48k). That
  # is a product-sized cost inside one test, and it grows with every batch.
  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libmecab-dev mecab zlib1g-dev \
            mecab-ipadic-utf8 util-linux
        # util-linux for setarch: TSan cannot map its shadow with the ASLR
        # entropy current kernels default to, and `setarch -R` is how the
        # Makefile's own tsan targets turn it off.

      - name: Unit tests under ThreadSanitizer
        working-directory: native
        run: make tsan-test

  # 57 JS files, a tracked lockfile and a vitest block that was configured in
  # vite.config.js and never run by anything. A syntax error in the web client
  # merged green until this job existed.
  web-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm ci` and not `npm install`: the lockfile is tracked, so CI must fail
      # on lockfile drift rather than silently resolving a different tree.
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Client tests
        working-directory: client
        run: npx vitest run

      # The suite covers 3 files; the build covers all 57. Most breakage in this
      # client is an import or JSX error that only a real bundle pass sees.
      - name: Client build
        working-directory: client
        run: npm run build

  # 148 Swift files, ~40k lines, zero tests and — until now — zero compilation
  # check. There are no shared schemes in the .xcodeproj, so this drives
  # -alltargets directly instead of -scheme; signing is off because CI has no
  # certificates and this is a compile gate, not a distribution build.
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # -scheme, not -alltargets: without a scheme xcodebuild prints "Ignoring
      # provided run destination because no scheme was passed" and builds with
      # SDKROOT=auto, so this step compiled macOS twice and iOS never. The
      # project has one target (JapanOsintApp); its scheme is that target.
      - name: Build (iOS)
        run: |
          xcodebuild -project ios/JapanOsintApp.xcodeproj \
            -scheme JapanOsintApp \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build

      # macOS is the SAME multiplatform target, not a separate app: the shared
      # sources compile against AppKit here and UIKit above, through the shims
      # in Shared/PlatformCompat.swift. Building only the iOS destination would
      # leave every one of those #if os() branches unchecked, which is precisely
      # where a cross-platform tree breaks — and it is the destination the Swift
      # 6 concurrency work was fixed against.
      - name: Build (macOS)
        run: |
          xcodebuild -project ios/JapanOsintApp.xcodeproj \
            -scheme JapanOsintApp \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build

  # Memory safety is this codebase's named critical bug class — heap
  # use-after-free and over-read, none of which crash reliably, so "it built
  # and produced rows" is not evidence. The asan target already existed and
  # was wired to nothing. Separate job because ASan needs its own object tree.
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      JO_SCHEMA: ${{ github.workspace }}/native/core/schema.sql
    steps:
      - uses: actions/checkout@v4
      # Step, not job-level env: `runner` is out of scope up there and takes the
      # whole file down with it. See build-and-test above.
      - name: Resolve the scratch DB path
        run: echo "JO_DB=$RUNNER_TEMP/ci-asan.db" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libmecab-dev mecab zlib1g-dev \
            mecab-ipadic-utf8
      - name: Unit tests under AddressSanitizer
        working-directory: native
        run: make asan-test

  # The Makefile's entire second half is macOS-only and, until this job, was
  # never once executed by CI: BREW_SSL (Homebrew openssl@3 when pkg-config
  # resolves nothing), BREW_CURL (Apple's libcurl is built WITHOUT WebSocket
  # support, which lib/ws.c needs, so the keg-only curl is prepended with an
  # -Wl,-rpath), and ICONV_LIB (-liconv exists off-Linux only). Those are
  # lines 8-20 and 29-35 of native/Makefile — and they are the half the
  # primary developer builds with every day, so the platform most likely to
  # break was the one platform nothing watched.
  #
  # macos-latest is Apple Silicon, so /opt/homebrew is the prefix both brew
  # probes in the Makefile test for.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      JO_SCHEMA: ${{ github.workspace }}/native/core/schema.sql

    steps:
      - uses: actions/checkout@v4

      # Step, not job-level env: `runner` is out of scope up there and takes the
      # whole file down with it. See build-and-test above.
      - name: Resolve the scratch DB path
        run: echo "JO_DB=$RUNNER_TEMP/ci-macos.db" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          for f in curl openssl@3 mecab mecab-ipadic pkg-config; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done
        # mecab-ipadic is the runtime dictionary, matching mecab-ipadic-utf8 on
        # the Ubuntu job: without it core/fts.c degrades to Latin passthrough
        # and the Japanese tokenizer path is never exercised.

      - name: Build
        working-directory: native
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Selftest
        working-directory: native
        run: make selftest

      - name: Unit tests (dispatcher fan-out)
        working-directory: native
        run: make unit

      - name: Record-engine tests (house rules 1 and 2)
        working-directory: native
        run: make hptest

      - name: JWT public-key round-trip
        working-directory: native
        run: make authtest

      - name: Paging and truncation disclosure
        working-directory: native
        run: make pagewalktest

      - name: HTML attribute scanner
        working-directory: native
        run: make htmlparsetest

      # A feed URL that has stopped being a feed used to report rc=0 records=0 —
      # indistinguishable from a newspaper that published nothing. Four national
      # press feeds were serving their HTML homepage. rsstest pins that a 2xx
      # body which is not a feed is a FAILED fetch, and — the half that keeps it
      # safe — that a valid feed with no items is still an honest empty.
      - name: RSS/Atom toolkit (a dead feed is not an empty feed)
        working-directory: native
        run: make rsstest

      # Deliberately NOT repeated here: lint-sources and audit-sources. Both
      # are pure python3 over the source text with no platform-dependent
      # behaviour, and the Ubuntu job above already fails the build on them.
      # Running them twice would only spend macOS runner minutes (billed 10x)
      # to re-derive the same numbers.
