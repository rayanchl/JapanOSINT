# The first CI this repository has ever had.
#
# Until now the entire safety net for 438k lines of C was a --selftest flag and
# a couple of scripts nobody could run, on a repo with a live GitHub remote.
# This is deliberately small and deliberately honest: every step here is one
# that passes today on a clean Ubuntu box. Nothing aspirational is wired in —
# a red build that is red for an unrelated reason gets ignored, and an ignored
# CI is the same as no CI.
#
# What it does NOT do, on purpose:
#   * no network-touching collector runs (they hit real third-party APIs)
#   * no llama-server (11 GB model); --selftest reports it "down" and passes
#   * no contract-parity suite (its fixtures need a DB with real intel rows)
#
# The client gap is now closed. `web-client` runs the vitest suite and the
# production build — both verified green offline before being wired in (3 files,
# 12 tests, ~23s; `vite build` transforms 2,010 modules in ~17s). `ios-build`
# compiles all targets on macOS with signing off; it is the one step here that
# could not be proven on the authoring machine (no macOS), so its first run is
# the proof. If it is red for an environment reason rather than a code reason,
# fix it or drop it — do not leave it red.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      # Keep the selftest's SQLite work in the runner's temp dir instead of the
      # checkout, so the schema-applied DB is never mistaken for tracked data.
      JO_DB: ${{ runner.temp }}/ci.db
      JO_SCHEMA: ${{ github.workspace }}/native/core/schema.sql

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libmecab-dev mecab zlib1g-dev \
            mecab-ipadic-utf8
        # mecab-ipadic-utf8 is the dictionary MeCab needs at runtime. core/fts.c
        # degrades gracefully without it (g_init_failed, Latin passthrough), but
        # then the Japanese FTS path is never exercised at all, which is the
        # half most likely to break.

      - name: Build
        working-directory: native
        run: make -j"$(nproc)"

      - name: Selftest
        working-directory: native
        run: make selftest

      - name: Unit tests (dispatcher fan-out)
        working-directory: native
        run: make unit

      # The two offline test binaries. Both were in the tree, both pass, and
      # neither was gated by anything — hptest is 38 assertions that encode
      # both house rules directly (truncation notices, pagination, detail hops,
      # missing-credential-is-an-honest-empty), and authtest generates real
      # RSA/EC keys and proves a JWT still verifies after the OpenSSL 3
      # migration. Neither needs network, a key, or a model.
      - name: Record-engine tests (house rules 1 and 2)
        working-directory: native
        run: make hptest

      - name: JWT public-key round-trip
        working-directory: native
        run: make authtest

      - name: Paging and truncation disclosure
        working-directory: native
        run: make pagewalktest

      - name: HTML attribute scanner
        working-directory: native
        run: make htmlparsetest

      - name: Lint collector sources
        working-directory: native
        run: make lint-sources

      # The engine's own guarantees, offline. hpengine.c is the only code path
      # with pagination, detail-hops and in-band truncation notices, and
      # tests/hpengine_test.c asserts 23 of them with a stubbed http_request —
      # no network, no key, seconds to run. It was not wired in, so the checks
      # that verify the house rules were the checks CI never ran.
      - name: Engine guarantees (hptest)
        working-directory: native
        run: make hptest

      # A collector that moves out of the build glob stops registering with no
      # error: the build succeeds, the binary links, and only the source count
      # drops. That happened during the collectors/ reorganisation — four
      # separate tools under-reported while the binary was correct — so the
      # count is asserted rather than printed. Floor lives in
      # native/tools/source-floor.txt and only ever ratchets up.
      - name: Source count floor
        working-directory: native
        run: make source-floor

      # source-floor greps the tree for REGISTER_SOURCE and is therefore blind
      # to HP_REGISTER_TABLE. It passed for months while the hp spec table's
      # fixed 1,024-entry array silently dropped 1,481 rows at boot. This asks
      # the binary instead, and fails on any duplicate id or dropped row.
      - name: Registry floor (asks the binary)
        working-directory: native
        run: make registry-floor

      # Reported, not gated. audit-sources is a heuristic scan for discarded
      # data (docs/SOURCE_EXHAUSTIVENESS.md); every finding needs a human read,
      # so failing on the count would train people to ignore it. But it must be
      # VISIBLE — it was reporting 146 findings that no CI run ever printed.
      - name: Exhaustive-use audit (report)
        working-directory: native
        run: make audit-sources

  # 57 JS files, a tracked lockfile and a vitest block that was configured in
  # vite.config.js and never run by anything. A syntax error in the web client
  # merged green until this job existed.
  web-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm ci` and not `npm install`: the lockfile is tracked, so CI must fail
      # on lockfile drift rather than silently resolving a different tree.
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Client tests
        working-directory: client
        run: npx vitest run

      # The suite covers 3 files; the build covers all 57. Most breakage in this
      # client is an import or JSX error that only a real bundle pass sees.
      - name: Client build
        working-directory: client
        run: npm run build

  # 148 Swift files, ~40k lines, zero tests and — until now — zero compilation
  # check. There are no shared schemes in the .xcodeproj, so this drives
  # -alltargets directly instead of -scheme; signing is off because CI has no
  # certificates and this is a compile gate, not a distribution build.
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build all iOS targets
        run: |
          xcodebuild -project ios/JapanOsintApp.xcodeproj -alltargets \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      # macOS is the SAME multiplatform target, not a separate app: the shared
      # sources compile against AppKit here and UIKit above, through the shims
      # in Shared/PlatformCompat.swift. Building only the iOS destination would
      # leave every one of those #if os() branches unchecked, which is precisely
      # where a cross-platform tree breaks — and it is the destination the Swift
      # 6 concurrency work was fixed against.
      - name: Build (macOS)
        run: |
          xcodebuild -project ios/JapanOsintApp.xcodeproj \
            -scheme JapanOsintApp \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build

  # Memory safety is this codebase's named critical bug class — heap
  # use-after-free and over-read, none of which crash reliably, so "it built
  # and produced rows" is not evidence. The asan target already existed and
  # was wired to nothing. Separate job because ASan needs its own object tree.
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      JO_DB: ${{ runner.temp }}/ci-asan.db
      JO_SCHEMA: ${{ github.workspace }}/native/core/schema.sql
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libmecab-dev mecab zlib1g-dev \
            mecab-ipadic-utf8
      - name: Unit tests under AddressSanitizer
        working-directory: native
        run: make asan-test

  # The Makefile's entire second half is macOS-only and, until this job, was
  # never once executed by CI: BREW_SSL (Homebrew openssl@3 when pkg-config
  # resolves nothing), BREW_CURL (Apple's libcurl is built WITHOUT WebSocket
  # support, which lib/ws.c needs, so the keg-only curl is prepended with an
  # -Wl,-rpath), and ICONV_LIB (-liconv exists off-Linux only). Those are
  # lines 8-20 and 29-35 of native/Makefile — and they are the half the
  # primary developer builds with every day, so the platform most likely to
  # break was the one platform nothing watched.
  #
  # macos-latest is Apple Silicon, so /opt/homebrew is the prefix both brew
  # probes in the Makefile test for.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      JO_DB: ${{ runner.temp }}/ci-macos.db
      JO_SCHEMA: ${{ github.workspace }}/native/core/schema.sql

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          for f in curl openssl@3 mecab mecab-ipadic pkg-config; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done
        # mecab-ipadic is the runtime dictionary, matching mecab-ipadic-utf8 on
        # the Ubuntu job: without it core/fts.c degrades to Latin passthrough
        # and the Japanese tokenizer path is never exercised.

      - name: Build
        working-directory: native
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Selftest
        working-directory: native
        run: make selftest

      - name: Unit tests (dispatcher fan-out)
        working-directory: native
        run: make unit

      - name: Record-engine tests (house rules 1 and 2)
        working-directory: native
        run: make hptest

      - name: JWT public-key round-trip
        working-directory: native
        run: make authtest

      - name: Paging and truncation disclosure
        working-directory: native
        run: make pagewalktest

      - name: HTML attribute scanner
        working-directory: native
        run: make htmlparsetest

      # Deliberately NOT repeated here: lint-sources and audit-sources. Both
      # are pure python3 over the source text with no platform-dependent
      # behaviour, and the Ubuntu job above already fails the build on them.
      # Running them twice would only spend macOS runner minutes (billed 10x)
      # to re-derive the same numbers.
